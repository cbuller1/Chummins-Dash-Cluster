# Chummins Dash — hardware port configuration
# Edit the port values to match your system.
#   Windows : COM3, COM4, …
#   Linux   : /dev/ttyACM0, /dev/ttyACM1, …
#
# Leave a port value blank to disable that device.
# Set sim = true under [app] to run without any hardware.

[app]
sim = false

[waveshare]
# Waveshare ESP32-S3-POE-ETH-8DI-8DO  (RPM, digital I/O, CAN relay outputs)
port = /dev/ttyACM0
baud = 115200

[feather_gps]
# Adafruit Feather M4 Express + GPS FeatherWing  (speed, odometer, trip counters)
port = /dev/ttyACM1
baud = 115200

[feather_adc]
# Adafruit Feather M4 CAN Express  (TPS, boost, range — talks to Waveshare via CAN, no direct Pi serial)
# No port entry needed; this device is not connected directly to the Raspberry Pi.
